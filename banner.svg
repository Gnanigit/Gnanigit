<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Yalla Gnaneswar - Software Engineer, AI and Full-Stack Systems" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C7D2FE"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="260" rx="16"/></clipPath>
  </defs>

  <style>
    .name  { font: 700 58px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #FFFFFF; letter-spacing: 1px; }
    .title { font: 500 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #C7D2FE; letter-spacing: 2px; }
    .tags  { font: 400 15px 'Courier New', Consolas, monospace; fill: #A5B4FC; letter-spacing: 1px; }
    .fade  { opacity: 0; animation: fadeUp 1.2s ease-out forwards; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: 1s; }
    .orb1 { animation: drift1 9s ease-in-out infinite alternate; }
    .orb2 { animation: drift2 11s ease-in-out infinite alternate; }
    .rule { transform-origin: 600px 168px; animation: grow 1.4s ease-out .5s both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(80px,20px); } }
    @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-90px,-15px); } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <circle class="orb1" cx="220" cy="60" r="220" fill="url(#glow)"/>
    <circle class="orb2" cx="980" cy="220" r="240" fill="url(#glow)"/>
    <!-- faint grid -->
    <g stroke="#FFFFFF" stroke-opacity="0.05">
      <path d="M0 65H1200M0 130H1200M0 195H1200"/>
      <path d="M200 0V260M400 0V260M600 0V260M800 0V260M1000 0V260"/>
    </g>
  </g>

  <text class="name fade d1" x="600" y="115" text-anchor="middle">Yalla Gnaneswar</text>
  <rect class="rule" x="440" y="136" width="320" height="2" fill="url(#line)"/>
  <text class="title fade d2" x="600" y="178" text-anchor="middle">SOFTWARE ENGINEER · AI &amp; FULL-STACK SYSTEMS</text>
  <text class="tags fade d3" x="600" y="214" text-anchor="middle">RAG  ·  LLM  ·  MCP  ·  AWS  ·  Azure</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
